spring.application.name=aawaaz-backend
server.port=8080

# Expose basic actuator endpoints (health, info)
management.endpoints.web.exposure.include=health,info

# In-memory H2 (V2 is in-memory only; data resets when the app stops).
# DB_CLOSE_DELAY=-1 keeps the DB alive for the life of the JVM.
spring.datasource.url=jdbc:h2:mem:aawaaz;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# schema.sql + data.sql own the schema/seed; Hibernate must not touch it.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always

# H2 web console at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:aawaaz)
spring.h2.console.enabled=true

# Translation via Sarvam hosted API. Set SARVAM_API_KEY in the environment.
# If the key is blank, translation is a no-op (text passes through unchanged).
sarvam.base-url=https://api.sarvam.ai
sarvam.api-key=${SARVAM_API_KEY:}
sarvam.model=sarvam-translate:v1

# Self-hosted face server (runs inside the same container; see V5). Cosine-similarity
# threshold for a 1:N match (ArcFace embeddings).
face.base-url=${FACE_SERVICE_URL:http://localhost:8000}
face.match-threshold=0.40
